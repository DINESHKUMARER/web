    <script>
        //cla back - A callback is a function passed to another function.

        function DoHomeWork(subject,callback){
             
            console.log(`Doing HomwWork ${subject}`)

            callback()
        }
        DoHomeWork("Maths", function(){
            console.log(`Home Work Done - Going Out`)
        })
    </script>
